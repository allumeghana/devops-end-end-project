<!DOCTYPE html>
<html>
<head>
    <title>Flask ToDo App</title>
</head>
<body>
    <h1>ToDo App</h1>

    <form action="/add" method="POST">
        <input type="text" name="task">
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for task in tasks %}
        <li>
            {{ task }}
            <a href="/delete/{{ loop.index0 }}">Delete</a>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
